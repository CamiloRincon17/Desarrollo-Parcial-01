  <main role="main">

     <!-- Plantilla de producto -->
<template id="producto-template">
  <article class="moto-card-template">
    <h3 class="producto-nombre"></h3>
    <img class="producto-imagen" src="" alt="#superbike">
    <ul class="producto-detalles"></ul>

  </article>
</template>

      </section>

      </section>
      <section id="motos-section" class="section" aria-label="Catálogo de motocicletas">
        <div class="container">
          <h2>Motos Disponibles</h2>
          <div id="catalogo-motos" role="region" aria-label="Catálogo de motocicletas disponibles">
            <div class="loading" role="status" aria-live="polite">Cargando catálogo de motos...</div>
          </div>
        </div>
      </section>
     
    </section>
  </main>
  
  <div id="footer-container"></div>

  <!-- Modal de detalles de moto -->
  <div id="motoModal" class="moto-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-content">
      <button class="close-modal" aria-label="Cerrar modal de detalles de moto" title="Cerrar">&times;</button>
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <span id="modalStatus" class="modal-status" aria-label="Estado de disponibilidad"></span>
      </div>
      <div class="modal-body">
        <div class="modal-image-container">
          <img id="modalImage" src="" alt="" role="img">
          <div class="image-gallery" id="imageGallery" role="group" aria-label="Galería de imágenes"></div>
        </div>
        <div class="modal-info">
          <section class="specs-section" aria-labelledby="specs-heading">
            <h3 id="specs-heading">Especificaciones</h3>
            <ul id="modalSpecs" role="list"></ul>
          </section>
          <section class="description-section" aria-labelledby="description-heading">
            <h3 id="description-heading">Descripción</h3>
            <p id="modalDescription"></p>
          </section>
          <div class="modal-actions" role="group" aria-label="Acciones disponibles">
            <button class="btn-primary" id="contactBtn" aria-label="Contactar sobre esta motocicleta">Contactar</button>
            <button class="btn-secondary" id="favoriteBtn" aria-label="Agregar o quitar de favoritos">❤️ Favorito</button>
          </div>
        </div>
      </div>
    </div>
